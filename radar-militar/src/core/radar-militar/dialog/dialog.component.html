<div class="container-fluid bg-green">
  <div class="dialog-content">
    <div class="row align-items-center justify-content-center h-100">
      <div class="col-md-12 text-center">
        <h1 class="text-white display-4 mb-4">SISTEMA DE RADAR MILITAR</h1>
        <div class="level-indicator mb-3">NIVEL: {{level}}</div>
        <h2 class="text-white message-box mb-5">{{mensaje}}</h2>
        
        <div class="col-md-12 d-flex justify-content-center mb-5">
          <img
            src="https://cdn.pixabay.com/photo/2013/07/12/15/59/proximity-150698_1280.png"
            class="radar-image"
            alt="Radar military"
          />
        </div>
        
        <div class="col-md-12 d-flex justify-content-center">
          <button class="action-button" mat-dialog-close (click)="onButtonClick()">
            <span class="button-text">{{buttonLabel}}</span>
            <span class="button-halo"></span>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
